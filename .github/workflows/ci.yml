name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — typecheck, lint, QR, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      - name: Verify the QR encoder
        run: npm run verify:qr

      - name: Build
        run: npm run build

  api:
    name: API — typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck and build
        run: npm run build

  smoke:
    name: API — full-election smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [api]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ssg_election
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install API dependencies
        run: npm install --no-audit --no-fund
        working-directory: api

      - name: Build the API
        run: npm run build
        working-directory: api

      - name: Run a full election against a fresh database
        working-directory: api
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/ssg_election
          SMOKE_VOTER: '2026-1000'
          SMOKE_CODE: DEMO01
        run: node ../scripts/smoke-test.mjs
