name: CI

# Runs before Vercel deploys: a push that breaks the client build or the
# election server shows up here as a red cross. (Making the check *required*
# is a repository setting; Vercel deploys independently of this workflow.)

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  client:
    name: Client — typecheck, lint, QR, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b

      - name: Lint
        run: npm run lint

      # The QR encoder is hand-written, so its correctness is asserted, not
      # assumed: matrix-identical to the reference library across 9 payloads
      # and all 8 masks, and decodable back to its input by jsqr.
      - name: Verify the QR encoder
        run: npm run verify:qr

      - name: Build
        run: npm run build

  server:
    name: Server — full-election smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Boots the server on a throwaway SQLite database and runs an entire
      # election over HTTP: login, validation, sealing, double-vote block,
      # receipt verification, publish gating, tally sanity, audit chain.
      - name: Run a full election against a fresh database
        run: node server/smoke-test.mjs
